name: Build SM8550 kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm8550-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.device }} build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device:
          - dm1q
          - dm2q
          - dm3q
          - q5q
          - b5q

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up workflow space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          sed -i 's/sudo apt purge/sudo apt-get purge/g' util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            android-sdk-libsparse-utils \
            attr \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            cpio \
            e2fsprogs \
            erofs-utils \
            f2fs-tools \
            flex \
            fuse2fs \
            fuse3 \
            git \
            libelf-dev \
            libfuse3-dev \
            liblz4-dev \
            libncurses5 \
            libssl-dev \
            libtinfo5 \
            libtool \
            lz4 \
            pkg-config \
            pv \
            python3 \
            rsync \
            unzip \
            uuid-dev \
            wget \
            xz-utils \
            zip \
            zlib1g-dev \
            zstd

          if ! command -v erofsfuse >/dev/null; then
            erofs_dir="${RUNNER_TEMP}/erofs-utils"
            git init --initial-branch=main "${erofs_dir}"
            git -C "${erofs_dir}" remote add origin https://github.com/erofs/erofs-utils.git
            git -C "${erofs_dir}" fetch --depth=1 origin 94f5a27f7b3878208e074038dec3f5c33b5fc3ba
            git -C "${erofs_dir}" checkout --detach FETCH_HEAD
            pushd "${erofs_dir}"
            mkdir -p m4
            WARNINGS=no-obsolete ./autogen.sh
            ./configure --enable-fuse
            make -j2
            sudo make install
            popd
          fi

          command -v mkfs.erofs
          command -v erofsfuse

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Clang22 and NDK r26d toolchain
        uses: actions/cache@v6
        with:
          path: kernel_platform/prebuilts
          key: samsung-sm8550-toolchain-clang22-r596125-ndk-r26d-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build ${{ matrix.device }} kernel
        run: |
          device='${{ matrix.device }}'
          ./build.sh "$device"

      - name: Verify fastboot release package
        shell: bash
        run: |
          set -euo pipefail

          device="${{ matrix.device }}"
          package="out/${device}/msm-kalama-kalama-gki/packaged/GoRhanHee_Kernel-kalama-${device}-fastboot.zip"
          [[ -f "${package}" ]] || {
            echo "::error::Required fastboot package not found: ${package}"
            exit 1
          }
          unzip -t "${package}" >/dev/null
          entries="$(zipinfo -1 "${package}" | LC_ALL=C sort)"
          expected="$(printf "%s\n" boot.img vendor_boot.img vendor_dlkm.img system_dlkm.img flash_windows.bat flash_macos.sh flash_linux.sh | LC_ALL=C sort)"
          [[ "${entries}" == "${expected}" ]] || {
            echo "::error::Fastboot package must contain exactly four images and three flash scripts"
            exit 1
          }

      - name: Upload fastboot kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device }}-fastboot-${{ github.sha }}
          path: out/${{ matrix.device }}/msm-kalama-kalama-gki/packaged/GoRhanHee_Kernel-kalama-${{ matrix.device }}-fastboot.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

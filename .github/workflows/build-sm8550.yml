name: Build universal SM8550 kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm8550-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: universal-${{ matrix.mode }} build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode:
          - vanilla
          - ksun
          - susfs

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up workflow space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          sed -i 's/sudo apt purge/sudo apt-get purge/g' util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            android-sdk-libsparse-utils \
            attr \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            cpio \
            e2fsprogs \
            flex \
            git \
            kmod \
            libelf-dev \
            liblz4-dev \
            libncurses5 \
            libselinux1-dev \
            libssl-dev \
            libtinfo5 \
            libtool \
            lz4 \
            pkg-config \
            pv \
            python3 \
            rsync \
            unzip \
            uuid-dev \
            wget \
            xz-utils \
            zip \
            zlib1g-dev \
            zstd

          command -v depmod

      - name: Restore Clang23 and NDK r26d toolchain
        uses: actions/cache@v6
        with:
          path: kernel_platform/prebuilts
          key: samsung-sm8550-toolchain-clang23-r614150-ndk-r26d-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Check external module load order
        run: bash prebuilts/tests/external_module_order_test.sh

      - name: Build universal-${{ matrix.mode }} kernel
        run: |
          mode='${{ matrix.mode }}'
          ./build.sh "$mode"

      - name: Upload AnyKernel3 kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-${{ matrix.mode }}-anykernel3-${{ github.sha }}
          path: out/universal/msm-kalama-kalama-gki-${{ matrix.mode }}/packaged/GoRhanHee_Kernel-kalama-universal-${{ matrix.mode }}-AnyKernel3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
